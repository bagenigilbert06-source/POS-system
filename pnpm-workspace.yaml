allowBuilds:
  '@prisma/client': false
  '@prisma/engines': false
  core-js: false
  esbuild: false
  prisma: false
  sharp: true
  unrs-resolver: false

# pnpm 11 otherwise performs an implicit install before every `pnpm run`.
# Dependency installation is explicit in this project, keeping dev startup fast
# and preventing the Prisma generators from running on every server restart.
verifyDepsBeforeRun: false

overrides:
  nanostores: 1.3.0
